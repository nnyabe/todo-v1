name: Build and Push to ECR

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR file with Maven
        run: mvn clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and tag Docker image
        run: |
          docker build -t todo-repo .
          docker tag todo-repo:latest 195275642256.dkr.ecr.eu-central-1.amazonaws.com/todo-repo:latest

      - name: Push image to Amazon ECR
        run: |
          docker push 195275642256.dkr.ecr.eu-central-1.amazonaws.com/todo-repo:latest

  trigger-sam-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger `todo-v1-sam` workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/nnyabe/todo-v1-sam/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'