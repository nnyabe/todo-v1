<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            transition: background-color 0.3s, color 0.3s;
        }

        /* Dark Mode */
        body.dark-mode {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        body.dark-mode .container {
            background-color: #2a2a2a;
        }

        body.dark-mode .sidebar {
            background-color: #3a3a3a;
        }

        body.dark-mode .task-item {
            background-color: #3a3a3a;
            border-bottom: 1px solid #4a4a4a;
        }

        body.dark-mode .task-item input[type="text"],
        body.dark-mode .task-item input[type="date"],
        body.dark-mode .task-item input[type="time"],
        body.dark-mode .task-item textarea {
            background-color: #4a4a4a;
            color: #ffffff;
            border: none;
        }

        body.dark-mode .add-task-btn {
            background-color: #007bff;
        }

        body.dark-mode .add-task-btn:hover {
            background-color: #0056b3;
        }

        /* Light Mode */
        body.light-mode {
            background-color: #f0f2f5;
            color: #000000;
        }

        body.light-mode .container {
            background-color: #ffffff;
        }

        body.light-mode .sidebar {
            background-color: #e9ecef;
        }

        body.light-mode .task-item {
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }

        body.light-mode .task-item input[type="text"],
        body.light-mode .task-item input[type="date"],
        body.light-mode .task-item input[type="time"],
        body.light-mode .task-item textarea {
            background-color: #f8f9fa;
            color: #000000;
            border: 1px solid #ced4da;
        }

        body.light-mode .add-task-btn {
            background-color: #007bff;
        }

        body.light-mode .add-task-btn:hover {
            background-color: #0056b3;
        }

        .container {
            display: flex;
            height: 100vh;
            padding: 20px;
            transition: background-color 0.3s;
        }

        .main-content {
            flex: 3;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar {
            flex: 1;
            padding: 20px;
            transition: background-color 0.3s;
            border-left: 1px solid #4a4a4a;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        .add-task {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            gap: 10px;
        }

        .add-task input,
        .add-task textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }

        .add-task .date-time {
            display: flex;
            gap: 10px;
        }

        .add-task .date-time input {
            flex: 1;
        }

        .add-task-btn {
            padding: 10px 20px;
            font-size: 16px;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .task-item .task-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .task-item input[type="checkbox"] {
            margin-right: 10px;
        }

        .task-item input[type="text"],
        .task-item input[type="date"],
        .task-item input[type="time"],
        .task-item textarea {
            width: 100%;
            padding: 5px;
            font-size: 16px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .task-item .edit-btn,
        .task-item .delete-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            margin-left: 10px;
        }

        .task-item .edit-btn {
            color: #007bff;
        }

        .task-item .delete-btn {
            color: #dc3545;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .pending-tasks {
            list-style: none;
        }

        .pending-tasks li {
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            border-radius: 5px;
            border-bottom: 1px solid #4a4a4a; /* Added thin line between pending tasks */
        }

        /* Last item doesn't need a border */
        .pending-tasks li:last-child {
            border-bottom: none;
        }

        /* Dark mode specific border for pending tasks */
        body.dark-mode .pending-tasks li {
            border-bottom: 1px solid #4a4a4a;
        }

        /* Light mode specific border for pending tasks */
        body.light-mode .pending-tasks li {
            border-bottom: 1px solid #dee2e6;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                border-left: none;
                border-top: 1px solid #4a4a4a;
            }

            .add-task .date-time {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="dark-mode">
<div class="container">
    <div class="main-content">
        <div class="header">
            <h1>Todo App</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
        <div class="add-task">
            <input type="text" id="new-heading" placeholder="Task Heading...">
            <textarea id="new-description" placeholder="Task Description..." rows="3"></textarea>
            <div class="date-time">
                <input type="date" id="new-date">
                <input type="time" id="new-time">
            </div>
            <button class="add-task-btn" onclick="addTask()">Add Task</button>
        </div>
        <ul class="task-list" id="task-list"></ul>
    </div>
    <div class="sidebar">
        <h2>Pending Tasks</h2>
        <ul class="pending-tasks" id="pending-tasks"></ul>
    </div>
</div>

<script>
    // Theme Toggle
    function toggleTheme() {
        const body = document.body;
        if (body.classList.contains('dark-mode')) {
            body.classList.remove('dark-mode');
            body.classList.add('light-mode');
            document.querySelector('.theme-toggle').textContent = '☀️';
        } else {
            body.classList.remove('light-mode');
            body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').textContent = '🌙';
        }
    }

    // Fetch all todos
    async function fetchTodos() {
        try {
            const response = await fetch('/api/todos');
            const todos = await response.json();
            renderTodos(todos);
            renderPendingTasks(todos);
        } catch (error) {
            console.error('Error fetching todos:', error);
            // For demo/development purposes, use sample data if the API call fails
            const sampleTodos = [
                { id: '1', heading: 'Sample Task 1', description: 'This is a sample task', date: '2025-04-10', time: '10:00', completed: false },
                { id: '2', heading: 'Sample Task 2', description: 'Another sample task', date: '2025-04-11', time: '14:00', completed: true }
            ];
            renderTodos(sampleTodos);
            renderPendingTasks(sampleTodos);
        }
    }

    // Add a new task
    async function addTask() {
        const headingInput = document.getElementById('new-heading');
        const descriptionInput = document.getElementById('new-description');
        const dateInput = document.getElementById('new-date');
        const timeInput = document.getElementById('new-time');

        const heading = headingInput.value.trim();
        const description = descriptionInput.value.trim();
        const date = dateInput.value;
        const time = timeInput.value;

        if (heading && description && date && time) {
            const newTodo = {
                heading,
                description,
                date,
                time,
                completed: false
            };

            try {
                await fetch('/api/todos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTodo)
                });
                headingInput.value = '';
                descriptionInput.value = '';
                dateInput.value = '';
                timeInput.value = '';
                fetchTodos();
            } catch (error) {
                console.error('Error adding todo:', error);
                alert('Failed to add task. Please try again.');
            }
        } else {
            alert('Please fill in all fields.');
        }
    }

    // Update a task
    async function updateTask(id, heading, description, date, time, completed) {
        const updatedTodo = {
            heading,
            description,
            date,
            time,
            completed
        };

        try {
            await fetch(`/api/todos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedTodo)
            });
            // Immediately update the pending tasks list when completion status changes
            fetchTodos();
        } catch (error) {
            console.error('Error updating todo:', error);
            alert('Failed to update task. Please try again.');
        }
    }

    // Toggle completion status
    async function toggleCompletion(id, heading, description, date, time, completed) {
        // Toggle the completion status and update the task
        await updateTask(id, heading, description, date, time, completed);
    }

    // Delete a task
    async function deleteTask(id) {
        try {
            await fetch(`/api/todos/${id}`, {
                method: 'DELETE'
            });
            fetchTodos();
        } catch (error) {
            console.error('Error deleting todo:', error);
            alert('Failed to delete task. Please try again.');
        }
    }

    // Render todos
    function renderTodos(todos) {
        const taskList = document.getElementById('task-list');
        taskList.innerHTML = '';
        todos.forEach(todo => {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.dataset.id = todo.id;
            li.innerHTML = `
                <div class="task-header">
                    <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleCompletion('${todo.id}', document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=text]').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] textarea').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=date]').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=time]').value, this.checked)">
                    <h3>${todo.heading}</h3>
                </div>
                <input type="text" value="${todo.heading}" onblur="updateTask('${todo.id}', this.value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] textarea').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=date]').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=time]').value, ${todo.completed})">
                <textarea onblur="updateTask('${todo.id}', document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=text]').value, this.value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=date]').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=time]').value, ${todo.completed})">${todo.description}</textarea>
                <input type="date" value="${todo.date}" onblur="updateTask('${todo.id}', document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=text]').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] textarea').value, this.value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=time]').value, ${todo.completed})">
                <input type="time" value="${todo.time}" onblur="updateTask('${todo.id}', document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=text]').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] textarea').value, document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=date]').value, this.value, ${todo.completed})">
                <button class="edit-btn" onclick="document.querySelector('.task-item[data-id=\\'${todo.id}\\'] input[type=text]').focus()">✏️</button>
                <button class="delete-btn" onclick="deleteTask('${todo.id}')">🗑️</button>
            `;
            taskList.appendChild(li);
        });
    }

    // Render pending tasks in the sidebar
    function renderPendingTasks(todos) {
        const pendingTasks = document.getElementById('pending-tasks');
        pendingTasks.innerHTML = '';

        // Filter only incomplete tasks
        const pending = todos.filter(todo => !todo.completed);

        pending.forEach(todo => {
            const li = document.createElement('li');
            li.innerHTML = `
                <strong>${todo.heading}</strong><br>
                ${todo.date} at ${todo.time}
            `;
            pendingTasks.appendChild(li);
        });

        // Show a message if there are no pending tasks
        if (pending.length === 0) {
            const li = document.createElement('li');
            li.innerHTML = '<em>No pending tasks</em>';
            pendingTasks.appendChild(li);
        }
    }

    // Initial fetch
    fetchTodos();
</script>
</body>
</html>
